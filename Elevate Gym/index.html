<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site gym</title>

    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  </head>

  <body class="imgfundo">
    <div class="titulo">
      <h1>
        <span style="color: darkred">ELEVATE</span>
        <span style="color: white">ACADEMY</span>
      </h1>

      <h4>
        Força, Determinação e Progresso,<br />Eleve seu Nivel com a Elevate!
      </h4>
    </div>

    <div class="container">
      <div class="login">
        <div class="campos">
          <div class="inputs">
            <span><i class="fa-sharp fa-solid fa-user"></i></span>
            <input type="email" id="email" placeholder="Email" />
          </div>

          <div class="inputs">
            <span><i class="fa-sharp fa-solid fa-lock"></i></span>
            <input type="password" id="senha" placeholder="Senha" />
            <div id="mensagem"></div>
          </div>
        </div>

        <div>
          <button class="btn" onclick="Login()">Entrar</button>
        </div>

        <div class="conta">
          <p>Não tem uma conta?<a href="#">Cadastre-se</a></p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
